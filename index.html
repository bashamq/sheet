<!DOCTYPE html>
<html>
<head>
  <title>⚡ Smart Energy Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: 'Segoe UI';
      text-align: center;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
    }

    .value {
      font-size: 22px;
      color: #22c55e;
    }

    button {
      padding: 10px 20px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }

    input {
      padding: 8px;
      border-radius: 6px;
      border: none;
      margin: 5px;
    }

    .alert {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>⚡ Smart Energy Dashboard</h1>

<div class="container">
  <div class="card">Voltage<br><span id="voltage" class="value"></span></div>
  <div class="card">Current<br><span id="current" class="value"></span></div>
  <div class="card">Power<br><span id="power" class="value"></span></div>
  <div class="card">Energy<br><span id="energy" class="value"></span></div>
  <div class="card">Limit<br><span id="limit" class="value"></span></div>
  <div class="card">Bill<br><span id="bill" class="value"></span></div>
  <div class="card">Alert<br><span id="alert"></span></div>
</div>

<input type="number" id="newLimit" placeholder="Set kWh Limit"><br>
<button onclick="setLimit()">Set Limit</button>
<button onclick="resetEnergy()">Reset</button>

<hr>

<h3>📅 History (Date Filter)</h3>

From:
<input type="date" id="fromDate">

To:
<input type="date" id="toDate">

<br>
<button onclick="downloadFiltered()">📄 View History Data</button>

<canvas id="chart"></canvas>

<script>

// Firebase Init
firebase.initializeApp({
  apiKey: "dq08PQL2JHCpD13e9295WjatZXFnQOZLCH7Ez4aO",
  databaseURL: "https://esp-983b0-default-rtdb.firebaseio.com/"
});

let db = firebase.database().ref("smart_home1");

// Chart
let chart = new Chart(document.getElementById("chart"), {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'Voltage', data: [], borderColor: '#38bdf8' },
      { label: 'Current', data: [], borderColor: '#22c55e' },
      { label: 'Power', data: [], borderColor: '#eab308' }
    ]
  }
});

// Live Data
db.on("value", snap => {
  let d = snap.val();
  if (!d) return;

  voltage.innerText = d.voltage?.toFixed(1);
  current.innerText = d.current?.toFixed(2);
  power.innerText = d.power?.toFixed(1);
  energy.innerText = d.energy?.toFixed(3);
  limit.innerText = d.energyLimit || 0;

  let bill = (d.energy || 0) * 25;
  document.getElementById("bill").innerText = bill.toFixed(0);

  alert.innerText = d.alert ? "⚠️ LIMIT!" : "Normal";
  alert.className = d.alert ? "alert" : "";

  let time = new Date().toLocaleTimeString();

  chart.data.labels.push(time);
  chart.data.datasets[0].data.push(d.voltage || 0);
  chart.data.datasets[1].data.push(d.current || 0);
  chart.data.datasets[2].data.push(d.power || 0);

  if (chart.data.labels.length > 15) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(ds => ds.data.shift());
  }

  chart.update();
});

// Set Limit
function setLimit() {
  let val = document.getElementById("newLimit").value;
  if (val) firebase.database().ref("smart_home1/energy_limit").set(Number(val));
}

// Reset
function resetEnergy() {
  firebase.database().ref("smart_home1/reset_command").set(1);
}

// ✅ GUARANTEED WORKING HISTORY VIEW
function downloadFiltered() {

  let from = document.getElementById("fromDate").value;
  let to = document.getElementById("toDate").value;

  if (!from || !to) {
    alert("Select both dates!");
    return;
  }

  let fromTs = Math.floor(new Date(from).getTime() / 1000);
  let toTs = Math.floor(new Date(to).getTime() / 1000) + 86400;

  firebase.database().ref("history1")
    .orderByKey()
    .startAt(fromTs)
    .endAt(toTs)
    .once("value", snap => {

      let data = snap.val();

      if (!data) {
        alert("No Data Found!");
        return;
      }

      let csv = "Time,Voltage,Current,Power,Energy\n";

      let arr = Object.entries(data).sort((a,b)=>b[0]-a[0]);

      arr.forEach(([k,v]) => {
        let time = new Date(k * 1000).toLocaleString();

        csv += `${time},${v.voltage || 0},${v.current || 0},${v.power || 0},${v.energy || 0}\n`;
      });

      // 🔥 ALWAYS WORKING METHOD
      let win = window.open();
      win.document.write("<pre>" + csv + "</pre>");
      win.document.title = "History Data";

    })
    .catch(err => {
      console.error(err);
      alert("Error loading data");
    });
}

</script>

</body>
</html>
