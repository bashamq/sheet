<!DOCTYPE html>
<html>
<head>
  <title>⚡ Smart Energy Pro Dashboard</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: 'Segoe UI';
      text-align: center;
    }

    h1 {
      color: #38bdf8;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,255,255,0.2);
    }

    .value {
      font-size: 22px;
      color: #22c55e;
    }

    .alert {
      color: red;
      font-weight: bold;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
    }

    canvas {
      max-width: 90%;
      margin-top: 20px;
    }

    table {
      border-collapse: collapse;
    }

    th, td {
      padding: 8px;
    }
  </style>
</head>

<body>

<h1>⚡ Smart Energy Pro Dashboard</h1>

<div class="container">
  <div class="card">Voltage<br><span id="voltage" class="value"></span> V</div>
  <div class="card">Current<br><span id="current" class="value"></span> A</div>
  <div class="card">Power<br><span id="power" class="value"></span> W</div>
  <div class="card">Energy<br><span id="energy" class="value"></span> kWh</div>
  <div class="card">Limit<br><span id="limit" class="value"></span> kWh</div>
  <div class="card">Bill<br><span id="bill" class="value"></span> PKR</div>
  <div class="card">Alert<br><span id="alert"></span></div>
</div>

<br>

<input type="number" id="newLimit" placeholder="Set kWh Limit">
<button onclick="setLimit()">Set Limit</button>
<button onclick="resetEnergy()">Reset</button>

<canvas id="chart"></canvas>

<h3 id="daily"></h3>

<!-- 🔥 HISTORY SECTION -->
<h2>📊 History Data</h2>

<button onclick="loadHistory()">Load Last 50</button>

<div style="max-height:300px; overflow:auto; margin:20px;">
  <table border="1" width="100%">
    <thead>
      <tr>
        <th>Time</th>
        <th>Voltage</th>
        <th>Current</th>
        <th>Power</th>
        <th>Energy</th>
      </tr>
    </thead>
    <tbody id="historyTable"></tbody>
  </table>
</div>

<script>

// Firebase config
var firebaseConfig = {
  apiKey: "dq08PQL2JHCpD13e9295WjatZXFnQOZLCH7Ez4aO",
  databaseURL: "https://esp-983b0-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);

var db = firebase.database().ref("smart_home4");

// Chart
var ctx = document.getElementById('chart').getContext('2d');

var chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'Voltage', data: [], borderWidth: 2 },
      { label: 'Current', data: [], borderWidth: 2 },
      { label: 'Power', data: [], borderWidth: 2 }
    ]
  }
});

// LIVE DATA
db.on("value", function(snapshot) {
  var d = snapshot.val();

  document.getElementById("voltage").innerText = d.voltage?.toFixed(2);
  document.getElementById("current").innerText = d.current?.toFixed(2);
  document.getElementById("power").innerText = d.power?.toFixed(2);
  document.getElementById("energy").innerText = d.energy?.toFixed(2);
  document.getElementById("limit").innerText = d.energyLimit?.toFixed(2);

  // BILL
  var unitRate = 60;
  var bill = d.energy * unitRate;
  document.getElementById("bill").innerText = bill.toFixed(0);

  // ALERT
  if (d.alert) {
    document.getElementById("alert").innerText = "⚠️ LIMIT!";
    document.getElementById("alert").className = "alert";
  } else {
    document.getElementById("alert").innerText = "Normal";
  }

  // GRAPH
  var time = new Date().toLocaleTimeString();

  chart.data.labels.push(time);
  chart.data.datasets[0].data.push(d.voltage);
  chart.data.datasets[1].data.push(d.current);
  chart.data.datasets[2].data.push(d.power);

  if (chart.data.labels.length > 15) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(ds => ds.data.shift());
  }

  chart.update();
});

// SET LIMIT
function setLimit() {
  var val = document.getElementById("newLimit").value;
  firebase.database().ref("smart_home4/energy_limit").set(Number(val));
}

// RESET
function resetEnergy() {
  firebase.database().ref("smart_home4/reset_command").set(1);
}

// DAILY ENERGY
firebase.database().ref("history").once("value", function(snapshot){
  var data = snapshot.val();
  var total = 0;

  Object.values(data || {}).forEach(item => {
    total += item.energy || 0;
  });

  document.getElementById("daily").innerText =
    "📊 Total Stored Energy: " + total.toFixed(2) + " kWh";
});

// HISTORY LOAD
function loadHistory() {

  firebase.database().ref("history4")
    .limitToLast(50)
    .once("value", function(snapshot) {

      var data = snapshot.val();
      var table = document.getElementById("historyTable");

      table.innerHTML = "";

      var labels = [];
      var powerData = [];

      Object.keys(data).forEach(function(key) {

        var item = data[key];
        var time = new Date(key * 1000).toLocaleString();

        var row = `
          <tr>
            <td>${time}</td>
            <td>${item.voltage?.toFixed(1)}</td>
            <td>${item.current?.toFixed(2)}</td>
            <td>${item.power?.toFixed(1)}</td>
            <td>${item.energy?.toFixed(2)}</td>
          </tr>
        `;

        table.innerHTML += row;

        labels.push(time);
        powerData.push(item.power);
      });

      chart.data.labels = labels;
      chart.data.datasets[2].data = powerData;
      chart.update();
    });
}

</script>

</body>
</html>
