<!DOCTYPE html>
<html>
<head>
  <title>📊 History (Last 50 Days)</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: 'Segoe UI';
      text-align: center;
    }

    h1 {
      color: #38bdf8;
    }

    table {
      width: 95%;
      margin: auto;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      border: 1px solid #334155;
    }

    th {
      background: #1e293b;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>📊 Last 50 Days History</h1>

<button onclick="loadHistory()">Load Data</button>

<table>
  <thead>
    <tr>
      <th>Time</th>
      <th>Voltage</th>
      <th>Current</th>
      <th>Power</th>
      <th>Energy</th>
    </tr>
  </thead>
  <tbody id="table"></tbody>
</table>

<script>

firebase.initializeApp({
  apiKey: "dq08PQL2JHCpD13e9295WjatZXFnQOZLCH7Ez4aO",
  databaseURL: "https://esp-983b0-default-rtdb.firebaseio.com/"
});

function loadHistory() {

  let now = Math.floor(Date.now() / 1000);
  let last50 = now - (50 * 24 * 60 * 60);

  firebase.database().ref("history1")
    .orderByKey()
    .startAt(last50.toString())
    .limitToLast(5000)
    .once("value", snap => {

      let data = snap.val();
      let table = document.getElementById("table");
      table.innerHTML = "";

      if (!data) {
        table.innerHTML = "<tr><td colspan='5'>No Data</td></tr>";
        return;
      }

      let arr = Object.entries(data).sort((a,b)=>b[0]-a[0]);

      arr.forEach(([k,v]) => {

        let time = new Date(k * 1000).toLocaleString();

        table.innerHTML += `
          <tr>
            <td>${time}</td>
            <td>${v.voltage?.toFixed(1) || '-'}</td>
            <td>${v.current?.toFixed(2) || '-'}</td>
            <td>${v.power?.toFixed(1) || '-'}</td>
            <td>${v.energy?.toFixed(3) || '-'}</td>
          </tr>
        `;
      });

    });
}

</script>

</body>
</html>
